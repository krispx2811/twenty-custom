name: Build custom CRM image

# Builds Twenty v2.22.0 from upstream + the CRMALARAMI customizations and pushes
# the image to GHCR. Railway pulls this image instead of the stock twentycrm/twenty.
# This repo holds only the build recipe + UI overlay - no secrets, no data.

on:
  push:
    branches: [main]
    paths:
      - crm-custom/**
      - .github/workflows/build-custom-crm.yaml
  workflow_dispatch:
    inputs:
      twenty_ref:
        description: Twenty version tag to build from
        default: twenty/v2.22.0
        required: true

permissions:
  contents: read
  packages: write

env:
  TWENTY_REF: ${{ github.event.inputs.twenty_ref || 'twenty/v2.22.0' }}
  IMAGE: ghcr.io/krispx2811/twenty-custom

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout customizations
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Checkout Twenty ${{ env.TWENTY_REF }}
        uses: actions/checkout@v4
        with:
          repository: twentyhq/twenty
          ref: ${{ env.TWENTY_REF }}
          path: twenty

      - name: Enable row-level permissions (self-host unlock)
        run: |
          node -e '
            const fs = require("fs");
            // Both the predicate service AND the group service have their own copy of
            // the Enterprise gate. Patching only the predicate one lets writes+enforcement
            // work but leaves group READS gated (Settings UI shows no RLS groups). Patch both.
            const base = "twenty/packages/twenty-server/src/engine/metadata-modules/row-level-permission-predicate/services/";
            const files = [
              base + "row-level-permission-predicate.service.ts",
              base + "row-level-permission-predicate-group.service.ts",
            ];
            const needle = "    return hasValidEnterprisePlan && isRowLevelPermissionEnabled;";
            let patched = 0;
            for (const f of files) {
              let s = fs.readFileSync(f, "utf8");
              if (!s.includes(needle)) { console.log("gate already patched or absent in " + f); continue; }
              s = s.replace(needle, "    return true; // ALARAIMI self-host: row-level permissions enabled");
              fs.writeFileSync(f, s);
              patched++;
              console.log("Patched RLS enterprise gate -> enabled in " + f);
            }
            if (patched === 0) throw new Error("RLS gate line not found in either service - update the patch for this Twenty version");
          '

      - name: Unlock all Enterprise features (self-host)
        run: |
          node -e '
            const fs = require("fs");
            // Master enterprise gate: EnterprisePlanService.isValid() delegates to
            // hasValidEnterpriseValidityToken(). Forcing an early return true unlocks
            // SSO/SAML, custom domain, audit logs, email domain, unlimited workspaces
            // and the AI admin UI (billing is already disabled on self-host, so the
            // billing-entitlement checks already pass).
            const f = "twenty/packages/twenty-server/src/engine/core-modules/enterprise/services/enterprise-plan.service.ts";
            let s = fs.readFileSync(f, "utf8");
            const gates = [
              ["hasValidEnterpriseValidityToken(): boolean {", "ALARAIMI enterprise unlock"],
              ["hasValidSignedEnterpriseKey(): boolean {", "ALARAIMI enterprise key"],
            ];
            let patched = 0;
            for (const g of gates) {
              const sig = g[0], tag = g[1];
              if (!s.includes(sig)) { console.log("signature not found: " + sig); continue; }
              if (s.includes(tag)) { console.log("already patched: " + tag); patched++; continue; }
              s = s.replace(sig, sig + "\n    return true; // " + tag);
              patched++;
              console.log("Patched enterprise gate -> " + tag);
            }
            if (patched === 0) throw new Error("enterprise gate methods not found - update the patch for this Twenty version");
            fs.writeFileSync(f, s);
          '

      - name: Inject Print PDF + Rial + Live alerts customizations into index.html
        run: |
          node -e '
            const fs = require("fs");
            const idx = "twenty/packages/twenty-front/index.html";
            let html = fs.readFileSync(idx, "utf8");
            if (!html.includes("</body>")) throw new Error("no </body> found in " + idx);

            // Insert before the LAST </body>: the Print inject embeds a literal
            // </body> inside its invoice-HTML template, so a first-match replace
            // would splice later injections inside that script and break it.
            const inject = (file, guard, label) => {
              const inj = fs.readFileSync(file, "utf8");
              if (html.includes(guard)) throw new Error(label + " already present");
              const at = html.lastIndexOf("</body>");
              if (at === -1) throw new Error("no </body> found in " + idx);
              html = html.slice(0, at) + inj + "\n  " + html.slice(at);
              console.log("Injected " + label);
            };
            inject("fork/crm-custom/print-invoice.inject.html", "tw-print-pdf", "Print PDF + Rial");
            inject("fork/crm-custom/alerts.inject.html", "tw-alerts-bell", "Live alerts");

            fs.writeFileSync(idx, html);
          '

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: twenty
          file: twenty/packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:2.22.0
            ${{ env.IMAGE }}:2.22.0-${{ github.run_number }}

      - name: Summary
        run: |
          echo "Pushed ${{ env.IMAGE }}:2.22.0 and :2.22.0-${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
