  const API = location.origin + "/rest";
  const esc = (x) => String(x == null ? "" : x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // Read the logged-in user's own token from where Twenty's frontend stores it.
  function getToken() {
    try {
      const pair = JSON.parse(localStorage.getItem("tokenPairState") || "null");
      return pair && pair.accessOrWorkspaceAgnosticToken && pair.accessOrWorkspaceAgnosticToken.token;
    } catch (e) {
      return null;
    }
  }

  function invoiceIdFromUrl() {
    const m = location.pathname.match(/\/object\/invoice\/([0-9a-f-]{36})/i);
    return m ? m[1] : null;
  }

  async function fetchInvoice(id) {
    const token = getToken();
    if (!token) throw new Error("You are not signed in.");
    const r = await fetch(`${API}/invoices/${id}?depth=1`, { headers: { Authorization: "Bearer " + token } });
    const j = await r.json();
    return j.data ? j.data.invoice || j.data : j;
  }

  function renderHtml(inv) {
    const a = CO.accentColor;
    const bt = inv.billTo || {}, nm = bt.name || {};
    const client = ((nm.firstName || "") + " " + (nm.lastName || "")).trim() || "—";
    const email = (bt.emails || {}).primaryEmail || "";
    const ph = bt.phones || {};
    const phone = ((ph.primaryPhoneCallingCode || "") + " " + (ph.primaryPhoneNumber || "")).trim();
    const net = (inv.amount || {}).amountMicros ? inv.amount.amountMicros / 1e6 : 0;
    const rate = inv.vatRate != null ? inv.vatRate : 5;
    const vat = (inv.vatAmount || {}).amountMicros != null ? inv.vatAmount.amountMicros / 1e6 : +(net * rate / 100).toFixed(3);
    const total = (inv.totalAmount || {}).amountMicros != null ? inv.totalAmount.amountMicros / 1e6 : net + vat;
    const title = (s) => (s || "").toLowerCase().replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    const itype = title(inv.invoiceType) || "Service";
    const status = title(inv.invoiceStatus);
    const paid = inv.invoiceStatus === "PAID";

    // rich property description built from the linked property's details
    const p = inv.property || {};
    const pname = p.name || "";
    const specs = [];
    if (p.propertyType) specs.push(title(p.propertyType));
    if (p.bedrooms) specs.push(p.bedrooms + " Bed");
    if (p.bathrooms) specs.push(p.bathrooms + " Bath");
    if (p.areaSqm != null) specs.push(Number(p.areaSqm).toLocaleString() + " m²"); else if (p.areaSqft) specs.push(Math.round(p.areaSqft * 0.092903).toLocaleString() + " m²");
    if (p.yearBuilt) specs.push("Built " + p.yearBuilt);
    const pa = p.propertyAddress || {};
    const addressStr = [pa.addressStreet1, pa.addressCity, pa.addressState, pa.addressPostcode].filter(Boolean).join(", ");
    const amenities = (p.amenities || []).map(title).join(", ");
    let period = "";
    if (inv.invoiceDate) { const d = new Date(inv.invoiceDate); if (!isNaN(d.getTime())) period = d.toLocaleDateString("en-US", { month: "long", year: "numeric" }); }
    const dline = (label, val) => val ? `<div style="color:#6b7280;font-size:12px;margin-top:3px"><span style="color:#9ca3af">${label}:</span> ${esc(val)}</div>` : "";
    const descHtml =
      `<div style="font-weight:600;color:#111827;font-size:13px">${esc(itype)}${pname ? " — " + esc(pname) : ""}</div>` +
      (specs.length ? `<div style="color:#374151;font-size:12px;margin-top:4px">${esc(specs.join("  ·  "))}</div>` : "") +
      dline("Location", addressStr) +
      (inv.invoiceType === "RENT" && period ? dline("Rental period", period) : "") +
      dline("Amenities", amenities) +
      (p.propertyDescription ? `<div style="color:#6b7280;font-size:12px;margin-top:5px;line-height:1.5">${esc(p.propertyDescription)}</div>` : "");

    const logo = CO.logoDataUrl ? `<img style="max-height:64px;max-width:220px" src="${CO.logoDataUrl}">`
      : `<div style="font-size:26px;font-weight:800;letter-spacing:1.5px;color:${a}">${esc(CO.companyName)}</div>`;
    const addr = (CO.addressLines || []).map(l => `<div>${esc(l)}</div>`).join("");
    const vatLine = (CO.vatNumber || CO.crNumber)
      ? `<div>${CO.vatNumber ? "VAT: " + esc(CO.vatNumber) : ""}${CO.vatNumber && CO.crNumber ? " · " : ""}${CO.crNumber ? "CR: " + esc(CO.crNumber) : ""}</div>` : "";
    const payHtml = (CO.iban || CO.bankName)
      ? `<div class="pay"><h3>Payment Details</h3>${CO.bankName ? `<div>${esc(CO.bankName)}${CO.bankAccountName ? " — " + esc(CO.bankAccountName) : ""}</div>` : ""}${CO.iban ? `<div>IBAN: ${esc(CO.iban)}</div>` : ""}</div>` : "";
    const f = (n) => n.toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 3 });
    const RIAL = '<img src="data:image/png;base64,' + RIAL_B64 + '" style="height:0.9em;width:auto;vertical-align:-0.12em;margin-right:3px" alt="OMR">';
    return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.name)}</title><style>
      @page{size:A4;margin:16mm} *{box-sizing:border-box}
      body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:#1f2937;margin:0;font-size:13px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .sheet{max-width:780px;margin:0 auto;padding:28px}
      .top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid ${a};padding-bottom:18px}
      .co{text-align:right;font-size:11px;color:#4b5563}.co .name{font-size:14px;font-weight:700;color:#111827}
      .tagline{color:#6b7280;font-size:11px;margin-top:6px;max-width:360px;line-height:1.5}
      .title-row{display:flex;justify-content:space-between;align-items:flex-start;margin:26px 0 8px}
      h1{font-size:30px;letter-spacing:2px;margin:0;color:${a}} .meta{text-align:right;font-size:12px}.meta b{color:#111827}
      .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
      .paid{background:#dcfce7;color:#166534}.unpaid{background:#fef9c3;color:#854d0e}
      .parties{display:flex;gap:24px;margin:22px 0}.box{flex:1;background:#f9fafb;border:1px solid #eef2f7;border-radius:8px;padding:12px 14px}
      .box h3{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6b7280}.box .big{font-weight:600;font-size:14px;color:#111827}
      table{width:100%;border-collapse:collapse;margin-top:10px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#6b7280;border-bottom:2px solid #e5e7eb;padding:8px 6px}
      td{padding:12px 6px;border-bottom:1px solid #f1f5f9}.r{text-align:right}
      .totals{width:280px;margin-left:auto;margin-top:14px}.totals div{display:flex;justify-content:space-between;padding:6px 0}
      .grand{border-top:2px solid ${a};margin-top:6px;padding-top:10px;font-size:17px;font-weight:700;color:${a}}
      .pay{margin-top:26px;background:#f9fafb;border-radius:8px;padding:14px;font-size:12px}.pay h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:${a}}
      .foot{margin-top:22px;text-align:center;color:#9ca3af;font-size:11px;border-top:1px solid #eef2f7;padding-top:14px}
    </style></head><body><div class="sheet">
      <div class="top"><div>${logo}<div class="tagline">${esc(CO.tagline)}</div></div>
       <div class="co"><div class="name">${esc(CO.companyName)}</div>${addr}
        <div>${esc(CO.phone)}</div><div>${esc(CO.email)}</div>${vatLine}</div></div>
      <div class="title-row"><h1>INVOICE</h1><div class="meta"><div><b>${esc(inv.name)}</b></div>
        <div>Issued: ${esc(inv.invoiceDate)}</div><div>Due: ${esc(inv.dueDate)}</div>
        ${paid ? `<div style="margin-top:6px"><span class="badge paid">${esc(status)}</span></div>` : ""}</div></div>
      <div class="parties"><div class="box"><h3>Bill To</h3><div class="big">${esc(client)}</div><div>${esc(email)}</div><div>${esc(phone)}</div></div></div>
      <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead>
       <tbody><tr><td>${descHtml}</td><td class="r" style="vertical-align:top">1</td><td class="r" style="vertical-align:top">${RIAL}${f(net)}</td></tr></tbody></table>
      <div class="totals"><div><span>Subtotal</span><span>${RIAL}${f(net)}</span></div>
       <div><span>VAT (${esc(rate)}%)</span><span>${RIAL}${f(vat)}</span></div>
       <div class="grand"><span>Total</span><span>${RIAL}${f(total)}</span></div></div>
      ${payHtml}
      <div class="foot">${esc(CO.footerNote)}<br>${esc(CO.companyName)} · ${esc(CO.website)}</div>
    </div><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`;
  }

  async function printInvoice() {
    const id = invoiceIdFromUrl();
    if (!id) return alert("Open an invoice first, then click Print PDF.");
    const btn = document.getElementById("tw-print-pdf");
    if (btn) btn.textContent = "Preparing…";
    try {
      const inv = await fetchInvoice(id);
      const w = window.open("", "_blank");
      w.document.write(renderHtml(inv));
      w.document.close();
    } catch (e) {
      alert("Could not build the invoice PDF: " + e.message);
    } finally {
      if (btn) btn.textContent = "Print PDF";
    }
  }

  function ensureButton() {
    const onInvoice = !!invoiceIdFromUrl();
    let btn = document.getElementById("tw-print-pdf");
    if (onInvoice && !btn) {
      btn = document.createElement("button");
      btn.id = "tw-print-pdf";
      btn.textContent = "Print PDF";
      btn.style.cssText = "position:fixed;bottom:20px;right:20px;z-index:99999;font-family:Inter,sans-serif;" +
        "background:#3E63DD;color:#fff;border:1px solid rgba(0,0,0,.08);padding:8px 14px;border-radius:6px;" +
        "font-weight:500;font-size:13px;line-height:1;letter-spacing:normal;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12)";
      btn.onmouseenter = () => { btn.style.background = "#3A5CCC"; };
      btn.onmouseleave = () => { btn.style.background = "#3E63DD"; };
      btn.onclick = printInvoice;
      document.body.appendChild(btn);
    } else if (!onInvoice && btn) {
      btn.remove();
    }
  }

  // Replace Twenty's generic "coins" icon (used for OMR) with the Omani Rial symbol.
  // Paint it as a mask filled with the icon's own colour so it follows the theme.
  function ensureRialStyle() {
    if (document.getElementById("crmalarami-rial")) return;
    const st = document.createElement("style");
    st.id = "crmalarami-rial";
    const u = 'url("data:image/png;base64,' + RIAL_B64 + '")';
    st.textContent =
      'svg.tabler-icon-coins{' +
      '-webkit-mask-image:' + u + ';mask-image:' + u + ';' +
      '-webkit-mask-size:contain;mask-size:contain;' +
      '-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;' +
      '-webkit-mask-position:center;mask-position:center;' +
      'background-color:currentColor!important;background-image:none!important}' +
      'svg.tabler-icon-coins>*{display:none!important}';
    (document.head || document.documentElement).appendChild(st);
  }

  setInterval(() => { ensureButton(); ensureRialStyle(); }, 800);
  ensureButton();
  ensureRialStyle();
})();
</script>
