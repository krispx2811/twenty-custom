<!-- CRMALARAMI: Live alerts. A floating bell that chimes + shows a desktop
     notification the moment a new lead or seller listing enters the CRM.
     Injected into Twenty's index.html at build time. Uses the logged-in user's
     own session token from localStorage (no secret baked in) and polls Twenty's
     same-origin /rest API. -->
<style>
  #tw-alerts-bell{position:fixed;right:20px;bottom:76px;z-index:99998;width:46px;height:46px;border-radius:50%;
    background:#3E63DD;color:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 4px 14px rgba(0,0,0,.22);
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif}
  #tw-alerts-bell:hover{background:#3A5CCC}
  #tw-alerts-bell svg{width:22px;height:22px}
  #tw-alerts-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
    background:#e5484d;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;display:none}
  #tw-alerts-enable{position:fixed;right:74px;bottom:82px;z-index:99998;background:#111827;color:#fff;
    font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;padding:9px 13px;border:none;border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,.24);cursor:pointer;display:none;white-space:nowrap}
  #tw-alerts-enable:hover{background:#000}
  #tw-alerts-panel{position:fixed;right:20px;bottom:132px;z-index:99998;width:330px;max-height:60vh;overflow:auto;
    background:#fff;border:1px solid #e6e6ea;border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.2);
    font-family:Inter,sans-serif;display:none}
  #tw-alerts-panel .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #f0f0f3}
  #tw-alerts-panel .hd b{font-size:14px;color:#111827}
  #tw-alerts-panel .hd span{font-size:12px;color:#6b7280;cursor:pointer}
  #tw-alerts-panel .empty{padding:26px 14px;text-align:center;color:#9ca3af;font-size:13px}
  .tw-al-row{display:block;padding:11px 14px;border-bottom:1px solid #f4f4f6;cursor:pointer;text-decoration:none}
  .tw-al-row:hover{background:#f7f8fa}
  .tw-al-row .t{font-size:13px;font-weight:600;color:#111827}
  .tw-al-row .s{font-size:12px;color:#6b7280;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tw-al-row .k{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;margin-right:6px;vertical-align:1px}
  .tw-al-row .k.lead{background:#eef2ff;color:#3E63DD}
  .tw-al-row .k.listing{background:#e7f6ec;color:#1a7f43}
  #tw-alerts-toasts{position:fixed;right:20px;bottom:134px;z-index:99997;display:flex;flex-direction:column-reverse;gap:8px;font-family:Inter,sans-serif}
  .tw-al-toast{width:300px;background:#fff;border:1px solid #e6e6ea;border-left:4px solid #3E63DD;border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px 12px;animation:tw-al-in .18s ease-out}
  .tw-al-toast.listing{border-left-color:#1a7f43}
  .tw-al-toast .t{font-size:13px;font-weight:700;color:#111827}
  .tw-al-toast .s{font-size:12px;color:#4b5563;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @keyframes tw-al-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<script>
(function () {
  'use strict';

  const API = location.origin + '/rest';
  const POLL_MS = 15000;
  const SEEN_KEY = 'tw-crm-alerts-seen';

  const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const title = (s) => String(s || '').toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  function getToken() {
    try {
      const p = JSON.parse(localStorage.getItem('tokenPairState') || 'null');
      return p && p.accessOrWorkspaceAgnosticToken && p.accessOrWorkspaceAgnosticToken.token;
    } catch (e) { return null; }
  }

  let audioCtx = null, unread = 0;
  const items = [];

  function highWater() { return localStorage.getItem(SEEN_KEY); }
  function setHighWater(v) { if (v) localStorage.setItem(SEEN_KEY, v); }

  // Browsers require a user gesture before audio/notifications; the user clicks
  // around the CRM anyway, so unlock on the first interaction.
  function unlock() {
    if (!audioCtx) {
      try { const C = window.AudioContext || window.webkitAudioContext; audioCtx = new C(); audioCtx.resume(); } catch (e) {}
    }
    if ('Notification' in window && Notification.permission === 'default') {
      try {
        const p = Notification.requestPermission();
        if (p && p.then) p.then(refreshEnable).catch(function () {});
      } catch (e) {}
    }
    refreshEnable();
  }
  // Alerts are "on" once audio is unlocked and notifications aren't left at the
  // default (un-decided) state. Show a clear prompt until then.
  function refreshEnable() {
    const chip = document.getElementById('tw-alerts-enable');
    if (!chip) return;
    const notifDecided = !('Notification' in window) || Notification.permission !== 'default';
    chip.style.display = (audioCtx && notifDecided) ? 'none' : 'block';
  }
  document.addEventListener('click', unlock, { once: false });
  document.addEventListener('keydown', unlock, { once: false });

  function chime() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t = t0 + i * 0.16;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.17);
    });
  }

  async function listRecords(path) {
    const token = getToken();
    if (!token) return [];
    try {
      const r = await fetch(`${API}/${path}?order_by=createdAt[DescNullsLast]&limit=20&depth=1`,
        { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) return [];
      const j = await r.json();
      const key = j.data && Object.keys(j.data)[0];
      return (key && j.data[key]) || [];
    } catch (e) { return []; }
  }

  const fullName = (n) => !n ? '' : (typeof n === 'string' ? n : ((n.firstName || '') + ' ' + (n.lastName || '')).trim());
  const phoneOf = (p) => !p ? '' : ((p.primaryPhoneCallingCode || '') + ' ' + (p.primaryPhoneNumber || '')).trim();

  function leadToItem(l) {
    const who = fullName(l.name) || (l.emails && l.emails.primaryEmail) || 'Someone';
    const contact = phoneOf(l.phones) || (l.emails && l.emails.primaryEmail) || '';
    const prop = l.interestedProperty && l.interestedProperty.name ? ' · ' + l.interestedProperty.name : '';
    return {
      id: 'lead-' + l.id, kind: 'lead', at: l.createdAt,
      title: 'New ' + (l.inquiryType ? title(l.inquiryType) + ' lead' : 'lead'),
      subtitle: [who, contact].filter(Boolean).join(' · ') + prop,
      href: location.origin + '/object/lead/' + l.id,
    };
  }
  function propToItem(p) {
    const price = p.listPrice && p.listPrice.amountMicros
      ? Math.round(p.listPrice.amountMicros / 1e6).toLocaleString() + ' ' + (p.listPrice.currencyCode || 'OMR') : '';
    return {
      id: 'prop-' + p.id, kind: 'listing', at: p.createdAt,
      title: 'New listing to review',
      subtitle: [p.name, p.governorate, price].filter(Boolean).join(' · '),
      href: location.origin + '/object/property/' + p.id,
    };
  }

  async function poll() {
    if (!getToken()) return;
    const hw = highWater();
    if (!hw) { setHighWater(new Date().toISOString()); return; } // baseline: never chime for history

    const [leads, props] = await Promise.all([listRecords('leads'), listRecords('properties')]);
    const fresh = [];
    leads.forEach(l => { if (l.createdAt && l.createdAt > hw) fresh.push(leadToItem(l)); });
    props.forEach(p => { if (p.propertyStatus === 'OFF_MARKET' && p.createdAt && p.createdAt > hw) fresh.push(propToItem(p)); });
    if (!fresh.length) return;

    fresh.sort((a, b) => a.at < b.at ? 1 : -1);
    setHighWater(fresh.reduce((m, it) => it.at > m ? it.at : m, hw));

    fresh.forEach(it => {
      items.unshift(it); unread++;
      showToast(it);
      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification(it.title, { body: it.subtitle, tag: it.id }); } catch (e) {}
      }
    });
    if (items.length > 50) items.length = 50;
    chime();
    renderBadge();
    renderList();
  }

  // ---------- UI ----------
  function bellSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>';
  }

  function ensureUi() {
    if (!getToken() || document.getElementById('tw-alerts-bell')) return;

    const bell = document.createElement('button');
    bell.id = 'tw-alerts-bell';
    bell.title = 'Live alerts';
    bell.innerHTML = bellSvg() + '<span id="tw-alerts-badge">0</span>';

    const panel = document.createElement('div');
    panel.id = 'tw-alerts-panel';
    panel.innerHTML = '<div class="hd"><b>Live alerts</b><span id="tw-alerts-clear">Clear</span></div><div id="tw-alerts-list"></div>';

    const toasts = document.createElement('div');
    toasts.id = 'tw-alerts-toasts';

    bell.onclick = () => {
      const open = panel.style.display === 'block';
      panel.style.display = open ? 'none' : 'block';
      if (!open) { unread = 0; renderBadge(); renderList(); }
    };
    const enableChip = document.createElement('button');
    enableChip.id = 'tw-alerts-enable';
    enableChip.textContent = 'Turn on alerts';
    enableChip.onclick = (e) => { e.stopPropagation(); unlock(); };

    document.body.appendChild(bell);
    document.body.appendChild(panel);
    document.body.appendChild(toasts);
    document.body.appendChild(enableChip);

    document.getElementById('tw-alerts-clear').onclick = () => {
      items.length = 0; unread = 0; renderBadge(); renderList();
    };
    refreshEnable();
  }

  function renderBadge() {
    const b = document.getElementById('tw-alerts-badge');
    if (!b) return;
    b.textContent = unread > 99 ? '99+' : String(unread);
    b.style.display = unread > 0 ? 'block' : 'none';
  }

  function renderList() {
    const list = document.getElementById('tw-alerts-list');
    if (!list) return;
    if (!items.length) { list.innerHTML = '<div class="empty">No new activity yet.</div>'; return; }
    list.innerHTML = items.map(it => {
      const time = (() => { try { return new Date(it.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } })();
      return '<a class="tw-al-row" href="' + esc(it.href) + '">' +
        '<div class="t"><span class="k ' + it.kind + '">' + (it.kind === 'lead' ? 'Lead' : 'Listing') + '</span>' + esc(it.title) + '</div>' +
        '<div class="s">' + esc(it.subtitle) + (time ? ' · ' + time : '') + '</div></a>';
    }).join('');
  }

  function showToast(it) {
    const wrap = document.getElementById('tw-alerts-toasts');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'tw-al-toast ' + it.kind;
    el.innerHTML = '<div class="t">' + esc(it.title) + '</div><div class="s">' + esc(it.subtitle) + '</div>';
    el.onclick = () => { window.location.href = it.href; };
    wrap.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 8000);
  }

  // Boot: build UI when logged in, then poll.
  ensureUi();
  setInterval(() => { ensureUi(); refreshEnable(); }, 2000);
  poll();
  setInterval(poll, POLL_MS);
})();
</script>
